<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Partner Sync — Synapse Graph</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="settings.js"></script>
<style>
:root {
  --navy-950: #0a0f1e;
  --navy-900: #0f172a;
  --navy-800: #1e293b;
  --navy-700: #334155;
  --gold: #f59e0b;
  --annual-c: #a855f7;
  --monthly-c: #38bdf8;
  --weekly-c: #34d399;
  --daily-c: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--navy-950);
  color: #e2e8f0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100%;
  overflow: hidden;
}

header {
  background: var(--navy-900);
  border-bottom: 1px solid var(--navy-700);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.back-btn {
  color: #64748b;
  text-decoration: none;
  display: flex;
  align-items: center;
  padding: 4px;
  border-radius: 8px;
  transition: color 0.15s;
}
.back-btn:hover { color: var(--gold); }
header h1 { font-size: 16px; font-weight: 700; color: var(--gold); letter-spacing: 0.05em; }
.subtitle { font-size: 11px; color: #475569; margin-top: 2px; }
.header-right { font-size: 11px; color: #475569; }

.filter-bar {
  padding: 12px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--navy-900);
  border-bottom: 1px solid var(--navy-700);
  position: relative;
  z-index: 99;
}
.filter-btn {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--navy-700);
  background: transparent;
  color: #64748b;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.03em;
}
.filter-btn:hover { border-color: var(--gold); color: var(--gold); }
.filter-btn.all.active     { background: var(--gold);      border-color: var(--gold);      color: var(--navy-950); }
.filter-btn.annual.active  { background: var(--annual-c);  border-color: var(--annual-c);  color: #fff; }
.filter-btn.monthly.active { background: var(--monthly-c); border-color: var(--monthly-c); color: var(--navy-950); }
.filter-btn.weekly.active  { background: var(--weekly-c);  border-color: var(--weekly-c);  color: var(--navy-950); }
.filter-btn.daily.active   { background: var(--daily-c);   border-color: var(--daily-c);   color: var(--navy-950); }

.legend {
  margin-left: auto;
  display: flex;
  gap: 12px;
  font-size: 10px;
  color: #475569;
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.mode-bar {
  padding: 8px 24px 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--navy-900);
  border-bottom: 1px solid var(--navy-700);
  position: relative;
  z-index: 98;
}
.mode-label { font-size: 9px; color: #475569; font-weight: 700; letter-spacing: 0.1em; margin-right: 4px; }
.mode-btn {
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--navy-700);
  background: transparent;
  color: #64748b;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}
.mode-btn:hover { border-color: var(--gold); color: var(--gold); }
.mode-btn.active { background: var(--navy-700); border-color: #94a3b8; color: #e2e8f0; }
.mode-btn.unfinished.active { background: rgba(248,113,113,0.15); border-color: #f87171; color: #f87171; }
.mode-btn.enlightenment.active { background: rgba(254,249,195,0.14); border-color: #fbbf24; color: #fbbf24; }
.mode-btn.emotion.active { background: rgba(245,158,11,0.15); border-color: var(--gold); color: var(--gold); }

.stage {
  position: relative;
  height: calc(100vh - 160px);
}
#graph {
  width: 100%;
  height: 100%;
}

.loading, .empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #475569;
  font-size: 14px;
  line-height: 2;
  text-align: center;
  padding: 20px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--navy-700);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 詳細パネル */
.detail-panel {
  position: absolute;
  top: 0;
  right: -360px;
  width: 340px;
  height: 100%;
  background: var(--navy-900);
  border-left: 1px solid var(--navy-700);
  padding: 20px;
  overflow-y: auto;
  transition: right 0.25s ease;
  z-index: 50;
}
.detail-panel.open { right: 0; }
.detail-close {
  background: none;
  border: none;
  color: #475569;
  cursor: pointer;
  float: right;
  font-size: 18px;
  line-height: 1;
}
.detail-close:hover { color: var(--gold); }
.badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 8px;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.badge.Annual  { background: var(--annual-c);  color: #fff; }
.badge.Monthly { background: var(--monthly-c); color: var(--navy-950); }
.badge.Weekly  { background: var(--weekly-c);  color: var(--navy-950); }
.badge.Daily   { background: var(--daily-c);   color: var(--navy-950); }
.detail-date { font-size: 13px; color: #cbd5e1; margin-bottom: 14px; clear: both; }
.detail-row { margin-bottom: 14px; }
.detail-label {
  font-size: 9px;
  color: #475569;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}
.detail-value { font-size: 12px; color: #94a3b8; line-height: 1.65; white-space: pre-wrap; }
.detail-hint {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid var(--navy-700);
  font-size: 10.5px;
  color: #475569;
  line-height: 1.6;
}

/* ミニチャプター(意味編集エンジン)モーダル — ボトムシート */
.chapter-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(2,8,23,0.6);
  backdrop-filter: blur(4px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.chapter-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
.chapter-sheet {
  position: relative;
  width: 100%;
  max-width: 480px;
  max-height: 86vh;
  background: var(--navy-900);
  border: 1px solid var(--navy-700);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -12px 40px rgba(0,0,0,0.5);
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(.22,.68,0,1.01);
}
.chapter-overlay.open .chapter-sheet { transform: translateY(0); }
.chapter-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--navy-700); margin: 6px auto 10px; }
.chapter-close {
  position: absolute;
  top: 10px; right: 16px;
  background: none; border: none;
  color: #475569;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  min-width: 44px; min-height: 44px;
}
.chapter-close:hover { color: var(--gold); }
.chapter-head { margin-bottom: 16px; }
.chapter-date { font-size: 12px; color: #64748b; margin-top: 6px; }
.chapter-section { margin-bottom: 16px; }
.chapter-section-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  color: var(--gold); margin-bottom: 5px;
}
.chapter-section-text { font-size: 13.5px; line-height: 1.75; color: #cbd5e1; white-space: pre-wrap; }
.chapter-skel {
  height: 13px; border-radius: 4px;
  background: linear-gradient(90deg, var(--navy-800) 25%, var(--navy-700) 37%, var(--navy-800) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
  margin-bottom: 8px;
}
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.chapter-note { font-size: 10.5px; color: #475569; margin-bottom: 16px; line-height: 1.6; }
.chapter-title { font-size: 17px; font-weight: 700; color: #f8fafc; margin-top: 10px; line-height: 1.5; }
.chapter-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chapter-chip { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--navy-700); color: #94a3b8; }
.chapter-chip.heavy { border-color: #a855f7; color: #d8b4fe; }
.chapter-chip.link { border-color: rgba(245,158,11,0.5); color: #fbbf24; background: none; cursor: pointer; font-family: inherit; }
.chapter-chip.link:hover { background: rgba(245,158,11,0.12); }
.chapter-invite { font-size: 12.5px; line-height: 1.75; color: #d8b4fe; background: rgba(168,85,247,0.08); border-radius: 10px; padding: 12px 14px; }
.chapter-log { padding-bottom: 4px; }
.chapter-ai-offer { margin-top: 8px; padding: 16px; border-radius: 12px; border: 1px dashed rgba(245,158,11,0.45); background: rgba(245,158,11,0.05); }
.chapter-ai-offer-text { font-size: 12px; line-height: 1.7; color: #94a3b8; margin-bottom: 12px; }
.chapter-btn.ai { width: 100%; background: rgba(245,158,11,0.12); border: 1px solid var(--gold); color: #fbbf24; }
.chapter-btn.ai:hover { background: rgba(245,158,11,0.2); }
.chapter-confirm { margin-top: 8px; padding: 16px; border-radius: 12px; border: 1px solid var(--gold); background: var(--navy-800); }
.chapter-confirm-title { font-size: 14px; font-weight: 700; color: #fbbf24; margin-bottom: 8px; }
.chapter-confirm-text { font-size: 12px; line-height: 1.75; color: #cbd5e1; margin-bottom: 14px; }
.chapter-confirm-actions { display: flex; gap: 10px; }
.chapter-confirm-actions .chapter-btn { flex: 1; }
.chapter-btn:disabled { opacity: 0.5; pointer-events: none; }
.chapter-ai-block { margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--navy-700); }
.chapter-ai-label { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: #fbbf24; }
.chapter-ai-block .chapter-meta { margin-bottom: 16px; }
.chapter-cta { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--navy-700); }
.chapter-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 46px;
  border-radius: 12px;
  font-size: 13.5px; font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s;
}
.chapter-btn.primary { background: var(--gold); border: none; color: var(--navy-950); }
.chapter-btn.primary:hover { filter: brightness(1.08); }
.chapter-btn.primary.done { background: var(--navy-700); color: #94a3b8; }
.chapter-btn.session { background: rgba(168,85,247,0.14); border: 1px solid #a855f7; color: #d8b4fe; }
.chapter-btn.session:hover { background: rgba(168,85,247,0.22); }
.chapter-btn.ghost { background: none; border: none; color: #475569; font-weight: 600; font-size: 11.5px; min-height: 36px; padding: 6px; }
.chapter-btn.ghost:hover { color: var(--gold); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html" class="back-btn" title="Home pageへ戻る"><span class="material-icons">arrow_back</span></a>
    <div>
      <h1>AI Partner Sync</h1>
      <div class="subtitle">Synapse Graph — 伏線回収の地図</div>
    </div>
  </div>
  <div class="header-right" id="entry-count"></div>
</header>

<div class="filter-bar">
  <button class="filter-btn all active" onclick="setFilter('ALL')">ALL</button>
  <button class="filter-btn annual"     onclick="setFilter('Annual')">Annual</button>
  <button class="filter-btn monthly"    onclick="setFilter('Monthly')">Monthly</button>
  <button class="filter-btn weekly"     onclick="setFilter('Weekly')">Weekly</button>
  <button class="filter-btn daily"      onclick="setFilter('Daily')">Daily</button>
  <div class="legend" id="legend">
    <span class="legend-item"><span class="legend-dot" style="background:var(--daily-c)"></span>Daily</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--weekly-c)"></span>Weekly</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--monthly-c)"></span>Monthly</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--annual-c)"></span>Annual</span>
  </div>
</div>

<div class="mode-bar">
  <span class="mode-label">MODE</span>
  <button class="mode-btn level active" onclick="setMode('level')">🎨 階層カラー</button>
  <button class="mode-btn emotion"      onclick="setMode('emotion')">🌈 感情カラー</button>
  <button class="mode-btn unfinished"   onclick="setMode('unfinished')">🔴 Unfinished Business</button>
  <button class="mode-btn enlightenment" onclick="setMode('enlightenment')">✨ 悟りポイント</button>
</div>

<div class="stage">
  <div id="graph"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    データを読み込み中...
  </div>
  <div class="detail-panel" id="detail-panel">
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <div id="detail-body"></div>
  </div>
  <div class="chapter-overlay" id="chapter-overlay" onclick="if(event.target===this) closeChapter()">
    <div class="chapter-sheet" id="chapter-sheet" role="dialog" aria-modal="true" aria-label="意味づけチャプター">
      <div class="chapter-handle"></div>
      <button class="chapter-close" onclick="closeChapter()" aria-label="閉じる">&times;</button>
      <div id="chapter-body"></div>
    </div>
  </div>
</div>

<script>
let allEntries = [];
let network = null;
let currentFilter = 'ALL';
let currentMode = 'level'; // 'level' | 'emotion' | 'unfinished' | 'enlightenment'
let nodeIndex = new Map();

const LEVEL_COLOR = { Daily: '#94a3b8', Weekly: '#34d399', Monthly: '#38bdf8', Annual: '#a855f7' };
const LEVEL_SIZE  = { Daily: 8, Weekly: 13, Monthly: 18, Annual: 24 };
// Unfinished Businessの判定: 感情スコア181(Pessimism 悲観)以下。GAS側 I_MiniChapter.js の MC_UB_MAX_SCORE と揃えること。
const UB_MAX_SCORE = 181;
function isUnfinished(e) { return !!e && e.score > 0 && e.score <= UB_MAX_SCORE; }
const FADE_COLOR  = { background: 'rgba(71,85,105,0.16)', border: 'rgba(71,85,105,0.16)', highlight: { background: 'rgba(71,85,105,0.3)', border: 'rgba(71,85,105,0.3)' } };

function nodeId(level, date) { return level + '::' + date; }

// Timeline Viewer（感情スコアの折れ線グラフ）と同じ配色基準。
// 1000=悟りの黄金、500+=橙金、350+=緑、200+=橙、200未満=赤（未解決の課題）
function scoreToColor(s) {
  if (!s || s <= 0) return '#475569';
  return s >= 1000 ? '#fef9c3' : s >= 500 ? '#f59e0b' : s >= 350 ? '#34d399' : s >= 200 ? '#fb923c' : '#f87171';
}

// 現在の表示モードに応じて、1ノード分の見た目（サイズ・色・後光）を決める
function nodeStyleForMode(e) {
  const baseSize = LEVEL_SIZE[e.level] || 8;

  if (currentMode === 'emotion') {
    const c = scoreToColor(e.score);
    return {
      size: baseSize,
      color: { background: c, border: 'rgba(255,255,255,0.25)', highlight: { background: '#fffdf5', border: '#f59e0b' } },
      shadow: e.score >= 1000
        ? { enabled: true, color: 'rgba(254,249,195,0.9)', size: 22, x: 0, y: 0 }
        : { enabled: false },
    };
  }

  if (currentMode === 'unfinished') {
    const hit = isUnfinished(e);
    return {
      size: hit ? baseSize * 1.5 : baseSize * 0.55,
      color: hit
        ? { background: '#f87171', border: '#fecaca', highlight: { background: '#fecaca', border: '#f87171' } }
        : FADE_COLOR,
      shadow: hit ? { enabled: true, color: 'rgba(248,113,113,0.85)', size: 20, x: 0, y: 0 } : { enabled: false },
    };
  }

  if (currentMode === 'enlightenment') {
    const hit = e.score >= 1000;
    return {
      size: hit ? baseSize * 1.6 : baseSize * 0.55,
      color: hit
        ? { background: '#fef9c3', border: '#fde68a', highlight: { background: '#fffdf5', border: '#f59e0b' } }
        : FADE_COLOR,
      shadow: hit ? { enabled: true, color: 'rgba(254,249,195,0.95)', size: 26, x: 0, y: 0 } : { enabled: false },
    };
  }

  // 'level'（デフォルト）
  return {
    size: baseSize,
    color: { background: LEVEL_COLOR[e.level] || '#94a3b8', border: 'rgba(255,255,255,0.25)', highlight: { background: '#fef9c3', border: '#f59e0b' } },
    shadow: { enabled: false },
  };
}

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.mode-btn').forEach(b => {
    const cls = [...b.classList].find(c => c !== 'mode-btn' && c !== 'active') || '';
    b.classList.toggle('active', cls === m);
  });
  updateLegend();
  buildGraph();
}

function updateLegend() {
  const legend = document.getElementById('legend');
  if (currentMode === 'emotion') {
    legend.innerHTML = `
      <span class="legend-item"><span class="legend-dot" style="background:#fef9c3"></span>1000 悟り</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>500+</span>
      <span class="legend-item"><span class="legend-dot" style="background:#34d399"></span>350+</span>
      <span class="legend-item"><span class="legend-dot" style="background:#fb923c"></span>200+</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f87171"></span>200未満</span>`;
  } else if (currentMode === 'unfinished') {
    legend.innerHTML = `<span class="legend-item"><span class="legend-dot" style="background:#f87171"></span>感情スコア181以下（Unfinished Business）だけを点灯。他は淡くフェード</span>`;
  } else if (currentMode === 'enlightenment') {
    legend.innerHTML = `<span class="legend-item"><span class="legend-dot" style="background:#fef9c3"></span>感情スコア1000（悟り）だけを点灯。他は淡くフェード</span>`;
  } else {
    legend.innerHTML = `
      <span class="legend-item"><span class="legend-dot" style="background:var(--daily-c)"></span>Daily</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--weekly-c)"></span>Weekly</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--monthly-c)"></span>Monthly</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--annual-c)"></span>Annual</span>`;
  }
}

async function loadData() {
  try {
    const gasUrl = apsLoadSettings().gasUrl;
    if (!gasUrl) throw new Error('GAS URLが未設定です');
    const sep = gasUrl.includes('?') ? '&' : '?';
    const res = await fetch(gasUrl + sep + 'page=timeline_data');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allEntries = (Array.isArray(data) ? data : []).filter(e => e.date);
    document.getElementById('entry-count').textContent = allEntries.length + ' entries';
    document.getElementById('loading').style.display = 'none';
    setFilter('ALL');
  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<div class="empty">データ取得に失敗しました。<br>
      <small style="color:#334155">${err.message}</small><br><br>
      <small>index.html の設定（⚙️）からGAS URLを確認してください。</small></div>`;
    console.error(err);
  }
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    const cls = [...b.classList].find(c => c !== 'filter-btn' && c !== 'active') || '';
    const match = (f === 'ALL' && cls === 'all') || cls === f.toLowerCase();
    b.classList.toggle('active', match);
  });
  closeDetail();
  buildGraph();
}

// synapse_link の先頭「YYYY-MM-DD:」から参照先の日付だけを取り出す
function extractLinkedDate(synapseLink) {
  if (!synapseLink) return null;
  const m = String(synapseLink).match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : null;
}

// "YYYY-MM-DD ~ YYYY-MM-DD" を { start, end } に分解
function parseDateRange(rangeStr) {
  if (!rangeStr) return null;
  const parts = String(rangeStr).split('~').map(s => s.trim());
  if (parts.length !== 2 || !parts[0] || !parts[1]) return null;
  return { start: parts[0], end: parts[1] };
}

// 指定日がその期間（date_range）に含まれるか（YYYY-MM-DD文字列は辞書式比較で日付比較できる）
function dateInRange(dateStr, rangeStr) {
  const r = parseDateRange(rangeStr);
  if (!r) return false;
  return dateStr >= r.start && dateStr <= r.end;
}

// 階層の抽象度の並び（Monthlyの月初日がDailyの実在日付と偶然一致する、といった
// 「下位階層への誤爆」を避けるため、期間の長さではなく階層の近さで優先順位をつける）
const LEVEL_ORDER = { Daily: 0, Weekly: 1, Monthly: 2, Annual: 3 };

// synapse_link が指す日付から、実際にリンクすべきノードを階層を問わず探す。
// 優先順位: ①自階層での完全一致 → ②他階層でdate_rangeに含まれるもののうち
// 階層距離が最も近いもの（同距離なら下位より上位階層を優先。AIが月初日/年始日で
// 上位階層を指した場合に、たまたま日付が一致した下位階層のDailyへ誤爆するのを防ぐ）
function findLinkTargetId(e, linkedDate) {
  const selfId = nodeId(e.level, e.date);
  const selfLevel = LEVEL_ORDER[e.level];

  const sameLevelId = nodeId(e.level, linkedDate);
  if (sameLevelId !== selfId && nodeIndex.has(sameLevelId)) return sameLevelId;

  let bestId = null;
  let bestDist = Infinity;
  let bestIsHigher = false;
  nodeIndex.forEach((entry, id) => {
    if (id === selfId || entry.level === e.level) return;
    const matched = entry.date_range
      ? dateInRange(linkedDate, entry.date_range)
      : entry.date === linkedDate;
    if (!matched) return;
    const diff = LEVEL_ORDER[entry.level] - selfLevel;
    const dist = Math.abs(diff);
    const isHigher = diff > 0;
    const better = dist < bestDist || (dist === bestDist && isHigher && !bestIsHigher);
    if (better) { bestDist = dist; bestIsHigher = isHigher; bestId = id; }
  });
  return bestId;
}

function buildGraph() {
  const entries = currentFilter === 'ALL'
    ? allEntries
    : allEntries.filter(e => e.level === currentFilter);

  if (!entries.length) {
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('loading').innerHTML = '<div class="empty">表示できるデータがありません</div>';
    return;
  }
  document.getElementById('loading').style.display = 'none';

  nodeIndex = new Map();
  const nodes = entries.map(e => {
    const id = nodeId(e.level, e.date);
    nodeIndex.set(id, e);
    const style = nodeStyleForMode(e);
    return {
      id,
      label: fmtLabel(e),
      shape: 'dot',
      size: style.size,
      color: style.color,
      shadow: style.shadow,
      font: { color: '#cbd5e1', size: 10, face: 'Segoe UI' },
    };
  });

  // synapse_link の日付を辿ってエッジを構築。
  // 自階層内の伏線回収だけでなく、Weekly→Monthly→Annualのように階層をまたぐ
  // 繋がりも findLinkTargetId で探す（階層をまたぐ場合は見た目を変えて区別する）。
  const edgeSet = new Set();
  const edges = [];
  entries.forEach(e => {
    const linkedDate = extractLinkedDate(e.synapse_link);
    if (!linkedDate) return;
    const fromId = nodeId(e.level, e.date);
    const toId = findLinkTargetId(e, linkedDate);
    if (!toId || toId === fromId || !nodeIndex.has(toId)) return;
    const key = [fromId, toId].sort().join('|');
    if (edgeSet.has(key)) return;
    edgeSet.add(key);
    const crossLevel = nodeIndex.get(toId).level !== e.level;
    edges.push({
      from: fromId,
      to: toId,
      color: crossLevel
        ? { color: 'rgba(245,158,11,0.55)', highlight: '#fbbf24', hover: '#fbbf24' }
        : { color: 'rgba(245,158,11,0.35)', highlight: '#f59e0b', hover: '#f59e0b' },
      width: crossLevel ? 2 : 1.3,
      dashes: crossLevel ? [2, 3] : false,
      smooth: { type: 'continuous', roundness: 0.4 },
      arrows: { to: { enabled: true, scaleFactor: 0.35 } },
    });
  });

  const container = document.getElementById('graph');
  const options = {
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: -60,
        springLength: 110,
        springConstant: 0.09,
        avoidOverlap: 0.6,
      },
      stabilization: { iterations: 200 },
    },
    interaction: { hover: true, tooltipDelay: 150, dragView: true, zoomView: true },
    layout: { improvedLayout: true },
  };

  network = new vis.Network(container, { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, options);
  network.once('stabilizationIterationsDone', () => network.fit({ animation: { duration: 400 } }));
  network.on('click', params => {
    if (params.nodes.length) {
      openChapter(nodeIndex.get(params.nodes[0]));
    } else {
      closeChapter();
    }
  });
}

function fmtLabel(e) {
  if (e.level === 'Annual')  return e.date.substring(0, 4);
  if (e.level === 'Monthly') return e.date.substring(0, 7);
  return e.date.substring(5);
}

function showDetail(e) {
  if (!e) return;
  const emotionText = (e.emotion && e.score)
    ? `${e.emotion}（Score: ${e.score}）${e.score >= 1000 ? ' ✨ 悟り' : isUnfinished(e) ? ' 🔴 Unfinished Business' : ''}`
    : null;
  const fields = [
    ['SUMMARY', e.summary],
    ['EMOTION', emotionText],
    ['INSIGHT', e.insight],
    ['KEYSTONE', e.keystone],
    ['TOP3 ACTUAL', e.top3_actual],
    ['TOP3 PLAN', e.top3_plan],
    ['ACTIONS', e.actions],
    ['TEACHING', e.teaching],
    ['BREAKTHROUGH', e.major_breakthrough],
    ['IDENTITY', e.identity_evolution],
    ['PHILOSOPHY', e.year_philosophy],
    ['LEGACY', e.legacy_testament],
    ['APHORISM', e.aphorism],
    ['伏線回収（synapse_link）', e.synapse_link],
  ].filter(([, v]) => v);

  const rows = fields.map(([label, val]) =>
    `<div class="detail-row">
      <div class="detail-label">${label}</div>
      <div class="detail-value">${esc(val)}</div>
    </div>`
  ).join('');

  document.getElementById('detail-body').innerHTML = `
    <span class="badge ${e.level}">${e.level.toUpperCase()}</span>
    <div class="detail-date">${esc(e.date_range || e.date)}</div>
    ${rows}
    <div class="detail-hint">線は synapse_link（AIが見つけた過去との関連）が指す日付へのリンクです。ノードをドラッグして配置を調整したり、ホイールでズームできます。</div>
  `;
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ===== ②意味編集エンジン: ミニチャプター・モーダル =====
const PARTNER_NAME = '菅ちゃん';
const SESSION_URL = 'https://rikkis-room.com/ja/briefing';
const PRACTICE_LOG_KEY = 'aps_chapter_practice_log';
let currentChapterEntry = null;

// heaviness算出(設計スペック「heaviness算出式」準拠)。
// GAS(I_MiniChapter.js)がtheme_idから求めたoccurrence_count/days_open/heavinessを
// timeline_dataに載せて返すので、それがあればそのまま使う。
// 旧バージョンのGAS(フィールド無し)の場合だけ、occurrence_count=0としてここで計算する。
function computeHeaviness(e) {
  if (!isUnfinished(e)) return null; // Unfinished Businessではない
  if (e.heaviness !== undefined) return e.heaviness;
  const depth = Math.min(Math.max(200 - e.score, 0), 200) / 200;
  const daysOpen = Math.max(0, (Date.now() - new Date(e.date).getTime()) / 86400000);
  const dwell = 1 - Math.exp(-daysOpen / 90);
  const raw = 0.30 * depth + 0.25 * dwell + 0.45 * 0;
  return raw >= 0.66 ? 'heavy' : raw >= 0.33 ? 'medium' : 'light';
}

// 意味編集エンジンのGAS側エンドポイント(page=mini_chapter)を呼ぶ。
// generate=false: 保存済みの意味づけを読むだけ(Gemini課金なし)。無ければ { status:'not_generated' }。
// generate=true : ユーザーが課金確認の上で「Go」を押した時だけ。Geminiで生成して保存する。
// 通信エラーや旧バージョンのGAS(エンドポイント無し)の場合は null。
async function fetchMiniChapter(e, generate) {
  try {
    const gasUrl = apsLoadSettings().gasUrl;
    if (!gasUrl) return null;
    const sep = gasUrl.includes('?') ? '&' : '?';
    const res = await fetch(gasUrl + sep + `page=mini_chapter&level=${encodeURIComponent(e.level)}&date=${encodeURIComponent(e.date)}${generate ? '&generate=1' : ''}`);
    if (!res.ok) return null;
    const data = await res.json();
    if (data && data.status === 'success' && data.event) return data;
    if (data && data.status === 'not_generated') return data;
    return null;
  } catch (err) {
    return null;
  }
}

function practiceKey(e) { return nodeId(e.level, e.date); }

function isPracticed(e) {
  try {
    const log = JSON.parse(localStorage.getItem(PRACTICE_LOG_KEY) || '{}');
    return !!log[practiceKey(e)];
  } catch (err) { return false; }
}

function markPracticed(e) {
  try {
    const log = JSON.parse(localStorage.getItem(PRACTICE_LOG_KEY) || '{}');
    log[practiceKey(e)] = new Date().toISOString();
    localStorage.setItem(PRACTICE_LOG_KEY, JSON.stringify(log));
  } catch (err) { /* private mode等で保存できなくても致命的ではない */ }
}

// タップ時の流れ(課金はユーザーの明示操作の時だけ):
//   ①記録のログをすぐ表示(課金なし)
//   ②保存済みの意味づけがあれば読み込んで表示(シートを読むだけ・課金なし)
//   ③無ければ「AIで意味を深掘りする」ボタン → 課金確認 → Goで初めてGeminiが動く
async function openChapter(e) {
  if (!e) return;
  closeDetail();
  currentChapterEntry = e;
  document.getElementById('chapter-body').innerHTML = `
    ${chapterHeadHtml(e)}
    ${chapterLogHtml(e)}
    <div id="chapter-ai"><div class="chapter-note">保存済みの意味づけを確認しています…</div></div>
    <div class="chapter-cta" style="border-top:none;margin-top:4px;padding-top:0">
      <button class="chapter-btn ghost" onclick="closeChapter(); showDetail(currentChapterEntry)">記録の詳細データを見る</button>
    </div>
  `;
  document.getElementById('chapter-overlay').classList.add('open');

  const data = await fetchMiniChapter(e, false);
  if (currentChapterEntry !== e) return;
  if (data && data.status === 'success') renderAiChapter(e, data);
  else renderGenerateOffer(e, data);
}

function chapterHeadHtml(e) {
  const heaviness = computeHeaviness(e);
  const chips = [];
  if (e.theme_id) chips.push(`<span class="chapter-chip ${heaviness === 'heavy' ? 'heavy' : ''}">${esc(e.theme_id)}${e.occurrence_count ? ` · ${e.occurrence_count}週で浮上` : ''}</span>`);
  if (e.emotion) chips.push(`<span class="chapter-chip">${esc(e.emotion)}${e.score ? `(${e.score})` : ''}</span>`);
  return `
    <div class="chapter-head">
      <span class="badge ${e.level}">${e.level.toUpperCase()}</span>
      <div class="chapter-date">${esc(e.date_range || e.date)}</div>
      ${chips.length ? `<div class="chapter-meta">${chips.join('')}</div>` : ''}
    </div>`;
}

// 課金なしで出せる「記録そのもの」
function chapterLogHtml(e) {
  const section = (label, text) => text
    ? `<div class="chapter-section"><div class="chapter-section-label">${label}</div><div class="chapter-section-text">${esc(text)}</div></div>`
    : '';
  const body = [
    section('記録', e.summary || '(この記録にはまだ要約がありません)'),
    section('KEYSTONE', e.keystone),
    section('INSIGHT', e.insight),
    section('伏線回収', e.synapse_link),
  ].join('');
  return `<div class="chapter-log">${body}</div>`;
}

function renderGenerateOffer(e, data) {
  const box = document.getElementById('chapter-ai');
  if (!box) return;
  if (!data) {
    box.innerHTML = `<div class="chapter-note">AIによる意味づけ(意味編集エンジン)に接続できませんでした。記録のみ表示しています。</div>`;
    return;
  }
  box.innerHTML = `
    <div class="chapter-ai-offer">
      <div class="chapter-ai-offer-text">この出来事が、その後の何につながっていたのか。AIが4つの視点(出来事・意味の再定義・学び・統合の一歩)で物語にします。</div>
      <button class="chapter-btn ai" onclick="showGenerateConfirm()">✨ AIで意味を深掘りする</button>
    </div>`;
}

function showGenerateConfirm() {
  const box = document.getElementById('chapter-ai');
  if (!box) return;
  box.innerHTML = `
    <div class="chapter-confirm" role="alertdialog" aria-label="API利用料の確認">
      <div class="chapter-confirm-title">API利用料がかかります</div>
      <div class="chapter-confirm-text">
        生成にはGoogleのGemini APIを使います。GASに設定したAPIキーに、1回あたり約1円(目安)の利用料が発生します。<br>
        生成した文章は保存され、次回からは無料で表示されます。生成には20秒ほどかかります。
      </div>
      <div class="chapter-confirm-actions">
        <button class="chapter-btn ghost" onclick="renderGenerateOffer(currentChapterEntry, {status:'not_generated'})">やめる</button>
        <button class="chapter-btn primary" onclick="runGenerate(this)">Go</button>
      </div>
    </div>`;
}

async function runGenerate(btn) {
  const e = currentChapterEntry;
  if (!e) return;
  if (btn) btn.disabled = true; // 二重押しで2回課金されないように
  document.getElementById('chapter-ai').innerHTML = `
    <div class="chapter-note">この出来事の意味を編んでいます…(20秒ほどかかります)</div>
    <div class="chapter-section"><div class="chapter-section-label">出来事</div><div class="chapter-skel"></div><div class="chapter-skel" style="width:85%"></div></div>
    <div class="chapter-section"><div class="chapter-section-label">意味の再定義</div><div class="chapter-skel"></div></div>
    <div class="chapter-section"><div class="chapter-section-label">学び</div><div class="chapter-skel" style="width:60%"></div></div>
    <div class="chapter-section"><div class="chapter-section-label">統合のための一歩</div><div class="chapter-skel" style="width:75%"></div></div>`;
  const data = await fetchMiniChapter(e, true);
  if (currentChapterEntry !== e) return;
  if (data && data.status === 'success') renderAiChapter(e, data);
  else document.getElementById('chapter-ai').innerHTML =
    `<div class="chapter-note">生成に失敗しました。時間をおいてもう一度お試しください。</div>`;
}

function renderAiChapter(e, chapter) {
  const box = document.getElementById('chapter-ai');
  if (!box) return;
  const heaviness = chapter.heaviness !== undefined ? chapter.heaviness : computeHeaviness(e);
  const section = (label, text) => text
    ? `<div class="chapter-section"><div class="chapter-section-label">${label}</div><div class="chapter-section-text">${esc(text)}</div></div>`
    : '';
  const practiced = isPracticed(e);
  const inviteText = (chapter.cta && chapter.cta.type === 'session_invite') ? chapter.cta.text : '';
  const r = chapter.resolved;
  const resolvedChip = (r && nodeIndex.has(nodeId(r.level, r.date)))
    ? `<div class="chapter-meta"><button class="chapter-chip link" onclick="jumpToChapter('${esc(r.level)}','${esc(r.date)}')">→ 回収先 ${esc(r.date_range || r.date)}</button></div>`
    : '';

  box.innerHTML = `
    <div class="chapter-ai-block">
      <div class="chapter-ai-label">✨ AIによる意味づけ</div>
      ${chapter.title ? `<div class="chapter-title">${esc(chapter.title)}</div>` : ''}
      ${resolvedChip}
      ${section('出来事', chapter.event)}
      ${section('意味の再定義', chapter.reframe)}
      ${section('学び', chapter.learning)}
      ${section('統合のための一歩', chapter.integration_action)}
      <div class="chapter-cta">
        <button class="chapter-btn primary ${practiced ? 'done' : ''}" onclick="handlePractice(this)">
          ${practiced ? '実践済み ✓' : '統合ワークを実践する'}
        </button>
        ${heaviness === 'heavy' ? `
          ${inviteText ? `<div class="chapter-invite">${esc(inviteText)}</div>` : ''}
          <a class="chapter-btn session" href="${SESSION_URL}" target="_blank" rel="noopener">${PARTNER_NAME}とセッションする</a>
        ` : ''}
      </div>
    </div>`;
}

function jumpToChapter(level, date) {
  const id = nodeId(level, date);
  const entry = nodeIndex.get(id);
  if (!entry) return;
  if (network) { network.selectNodes([id]); network.focus(id, { scale: 1.2, animation: { duration: 500 } }); }
  openChapter(entry);
}

function handlePractice(btn) {
  if (!currentChapterEntry) return;
  markPracticed(currentChapterEntry);
  btn.textContent = '実践済み ✓';
  btn.classList.add('done');
}

function closeChapter() {
  document.getElementById('chapter-overlay').classList.remove('open');
}

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { closeChapter(); closeDetail(); }
});

window.onload = loadData;
</script>
